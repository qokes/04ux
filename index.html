    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
    });

    function installPWA() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                }
                deferredPrompt = null;
            });
        } else {
            alert("04UX.COM App: Use browser options ('Add to Home Screen' / 'Install App') to run as standalone app.");
        }
    }

    let deviceHwId = localStorage.getItem('04ux_strict_hw_id');
    if (!deviceHwId) {
        deviceHwId = 'HW_04UX_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
        localStorage.setItem('04ux_strict_hw_id', deviceHwId);
    }

    // EFECTO PECES CIBERNÉTICOS EN MOVIMIENTO (FONDO EXÓTICO)
    const canvas = document.getElementById('fishCanvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class CyberFish {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 1.8;
            this.vy = (Math.random() - 0.5) * 0.8;
            this.size = Math.random() * 8 + 4;
            this.color = Math.random() > 0.2 ? '#d4af37' : '#00ffcc';
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;
            if (this.y < 0) this.y = canvas.height;
            if (this.y > canvas.height) this.y = 0;
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 0.4, 0, Math.PI * 2);
            ctx.fill();
            // Cola del pez
            ctx.beginPath();
            ctx.moveTo(this.x - (this.vx > 0 ? this.size : -this.size), this.y);
            ctx.lineTo(this.x, this.y - this.size * 0.6);
            ctx.lineTo(this.x, this.y + this.size * 0.6);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    for (let i = 0; i < 35; i++) { fishes.push(new CyberFish()); }

    function animateFishes() {
        ctx.fillStyle = "rgba(2, 4, 10, 0.2)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        fishes.forEach(fish => {
            fish.update();
            fish.draw();
        });
        requestAnimationFrame(animateFishes);
    }
    animateFishes();

    // SHAKE TO WIPE (Agitar teléfono borra chats al instante)
    let lastX = 0, lastY = 0, lastZ = 0;
    window.addEventListener('devicemotion', (e) => {
        let acc = e.accelerationIncludingGravity;
        if (!acc) return;
        let deltaX = Math.abs(acc.x - lastX);
        let deltaY = Math.abs(acc.y - lastY);
        let deltaZ = Math.abs(acc.z - lastZ);
        if (deltaX + deltaY + deltaZ > 25) {
            executeInstantWipe();
        }
        lastX = acc.x; lastY = acc.y; lastZ = acc.z;
    });

    function executeInstantWipe() {
        const chatScreen = document.getElementById('chatMessages');
        if(chatScreen) chatScreen.innerHTML = "";
        document.getElementById('chatPanel').style.display = "none";
        isReadingMessages = false;
    }

    const socket = io();
    let myUx = "";
    let myBalance = 0;
    let sessionTimerInterval = null;
    let selectedTimeoutSeconds = 90;
    let mailboxBuffer = [];
    let isReadingMessages = false;

    async function registerNode() {
        const user = document.getElementById('userInput').value.trim();
        const pass = document.getElementById('passInput').value.trim();
        if (!user || !pass) { alert("Enter UX and PIN."); return; }

        try {
            const res = await fetch('/api/register-node', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user, pass, hwId: deviceHwId })
            });
            const data = await res.json();
            if (!data.success) { alert(data.message); return; }
            myBalance = data.balance;
            grantAccess(user);
        } catch (err) { alert('Network error.'); }
    }

    async function loginNode() {
        const user = document.getElementById('userInput').value.trim();
        const pass = document.getElementById('passInput').value.trim();
        if (!user || !pass) { alert("Enter UX and PIN."); return; }

        try {
            const res = await fetch('/api/login-node', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user, pass })
            });
            const data = await res.json();
            if (!data.success) { alert(data.message); return; }
            myBalance = data.balance;
            grantAccess(user);
        } catch (err) { alert('Network error.'); }
    }

    function grantAccess(user) {
        myUx = user;
        document.getElementById('myActiveUxLabel').innerText = "UX: " + user;
        document.getElementById('balanceDisplay').innerText = "UX: " + myBalance;
        document.getElementById('chatPanel').style.display = "block";
        socket.emit('register_presence', user);
        
        document.getElementById('ledStatus').className = "led-indicator online";
        document.getElementById('statusText').innerText = "ONLINE";
        document.getElementById('statusText').style.color = "#22c55e";

        startChatTimer();
    }

    function updateChatTimerConfig() {
        selectedTimeoutSeconds = parseInt(document.getElementById('timerSelect').value);
        startChatTimer();
    }

    function startChatTimer() {
        if (sessionTimerInterval) clearInterval(sessionTimerInterval);
        let elapsed = 0;
        sessionTimerInterval = setInterval(async () => {
            elapsed++;
            if (elapsed === selectedTimeoutSeconds) {
                clearInterval(sessionTimerInterval);
                try {
                    await fetch('/api/deduct-time-fee', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user: myUx, amount: 2 })
                    });
                } catch(e){}
                executeInstantWipe();
            }
        }, 1000);
    }

    function toggleReadMessages() {
        const chatScreen = document.getElementById('chatMessages');
        if (!isReadingMessages) {
            isReadingMessages = true;
            chatScreen.style.display = "block";
            renderMailbox();
        } else {
            isReadingMessages = false;
            chatScreen.style.display = "none";
        }
    }

    function openMailbox() {
        const chatScreen = document.getElementById('chatMessages');
        isReadingMessages = true;
        chatScreen.style.display = "block";
        renderMailbox();
    }

    socket.on('mailbox_messages', (list) => {
        mailboxBuffer = list;
        if (isReadingMessages) renderMailbox();
    });

    socket.on('incoming_message', (data) => {
        mailboxBuffer.push(data);
        if (isReadingMessages) appendMessageToScreen(data);
    });

    function renderMailbox() {
        const chatScreen = document.getElementById('chatMessages');
        chatScreen.innerHTML = "<div style='color:#d4af37; font-weight:bold; margin-bottom:3px;'>--- 04UX MAILBOX ---</div>";
        mailboxBuffer.forEach(data => appendMessageToScreen(data));
    }

    function appendMessageToScreen(data) {
        const chatScreen = document.getElementById('chatMessages');
        const isMe = (data.senderUx === myUx);
        const bubbleClass = isMe ? 'msg-outgoing' : 'msg-incoming';
        chatScreen.innerHTML += `<div class="msg-bubble ${bubbleClass}"><strong>UX ${data.senderUx}:</strong> ${data.text} <span style="font-size:0.45rem; opacity:0.6; float:right;">${data.time}</span></div>`;
        chatScreen.scrollTop = chatScreen.scrollHeight;
    }

    function sendChatMessage() {
        const targetUx = document.getElementById('targetUxInput').value.trim();
        const text = document.getElementById('chatInputMsg').value.trim();
        if(!text || !targetUx) { alert("Target UX and message required."); return; }
        socket.emit('private_chat', { senderUx: myUx, targetUx: targetUx, text: text });
        document.getElementById('chatInputMsg').value = '';
    }

    function handleChatKey(e) { if(e.key === 'Enter') sendChatMessage(); }

    socket.on('forced_logout', (msg) => {
        alert('⚠️ ' + msg);
        executeInstantWipe();
    });

    socket.on('update_balance', (data) => {
        myBalance = data.balance;
        document.getElementById('balanceDisplay').innerText = "UX: " + myBalance;
    });

    function connectNfcPin() {
        if (!myUx) { alert("Login first."); return; }
        const inviteUrl = window.location.origin + "/?chat=" + myUx;
        navigator.clipboard.writeText(inviteUrl);
        alert("🔗 NFC Link copied:\n" + inviteUrl);
    }

    async function processRecharge() {
        const packageKey = document.getElementById('packageSelect').value;
        const txid = document.getElementById('txidInput').value.trim();
        if(!myUx) { alert("Login first."); return; }
        if(!txid) { alert("Enter TXID."); return; }

        try {
            const res = await fetch('/api/recharge-ux', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user: myUx, packageKey, txid })
            });
            const data = await res.json();
            if(data.success) {
                myBalance = data.newBalance;
                document.getElementById('balanceDisplay').innerText = "UX: " + myBalance;
                alert(data.message);
                document.getElementById('txidInput').value = '';
            } else {
                alert('Error: ' + data.message);
            }
        } catch(e) { alert('Network error.'); }
    }
</script>

</body>
</html>

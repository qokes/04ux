<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04UX.COM // SECURE SYSTEM</title>
    <style>
        canvas#cyberCanvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; pointer-events: none; background: #010204;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 25px rgba(212,175,55,0.3), inset 0 0 15px rgba(212,175,55,0.1); }
            50% { box-shadow: 0 0 50px rgba(212,175,55,0.7), inset 0 0 25px rgba(212,175,55,0.3); }
            100% { box-shadow: 0 0 25px rgba(212,175,55,0.3), inset 0 0 15px rgba(212,175,55,0.1); }
        }
        body {
            background-color: #010204; color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 6px; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box; overflow-x: hidden;
        }
        .elite-card {
            max-width: 410px; width: 100%;
            background: rgba(4, 7, 15, 0.94); backdrop-filter: blur(30px);
            padding: 14px; border-radius: 18px; border: 1.5px solid rgba(212, 175, 55, 0.7);
            animation: pulseGlow 4s infinite; box-sizing: border-box; position: relative; z-index: 2;
        }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 6px; margin-bottom: 8px;
        }
        .brand { font-size: 0.85rem; font-weight: 900; color: #fef08a; letter-spacing: 1.5px; }
        .balance-badge { font-size: 0.65rem; color: #22c55e; font-weight: bold; background: rgba(34,197,94,0.12); padding: 3px 8px; border-radius: 8px; border: 1px solid rgba(34,197,94,0.35); }
        .input-cyber {
            background: #03050a; border: 1.5px solid #1e293b; border-radius: 8px;
            padding: 9px; font-size: 0.85rem; color: #fef08a; width: 100%;
            box-sizing: border-box; text-align: center; margin-bottom: 8px; outline: none;
        }
        .input-cyber:focus { border-color: #d4af37; }
        .btn-container { display: flex; gap: 6px; margin-bottom: 8px; }
        .btn-master { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 800; font-size: 0.7rem; cursor: pointer; background: linear-gradient(135deg, #d4af37, #9a7b20); color: #02040a; }
        .btn-login { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #d4af37; font-weight: 800; font-size: 0.7rem; cursor: pointer; background: #0f172a; color: #fef08a; }
        
        #platformPanel { display: none; margin-top: 8px; }
        .recharge-box {
            background: #03050a; border: 1px dashed #d4af37; border-radius: 10px; padding: 10px; margin-top: 8px;
        }
        .package-select {
            width: 100%; background: #020307; border: 1px solid #334155; color: #fef08a;
            padding: 7px; border-radius: 6px; font-size: 0.7rem; margin-bottom: 6px; outline: none;
        }
        .wallet-text { font-size: 0.55rem; color: #94a3b8; word-break: break-all; margin-bottom: 6px; text-align: center; background: #080c16; padding: 4px; border-radius: 4px; }
        .btn-recharge {
            background: linear-gradient(135deg, #d4af37, #b8860b); color: #02040a;
            width: 100%; padding: 8px; border-radius: 6px; border: none; font-weight: bold; font-size: 0.7rem; cursor: pointer;
        }
        .footer-tag { text-align: center; font-size: 0.48rem; color: #64748b; margin-top: 8px; }
    </style>
</head>
<body>

<canvas id="cyberCanvas"></canvas>

<div class="elite-card">
    <div class="top-bar">
        <div class="brand">04UX.COM</div>
        <div class="balance-badge" id="balanceDisplay">UX: 0</div>
    </div>

    <input type="text" id="userInput" class="input-cyber" placeholder="UX NUMBER" autocomplete="off">
    <input type="password" id="passInput" class="input-cyber" placeholder="PIN CODE" autocomplete="new-password">

    <div class="btn-container">
        <button class="btn-master" onclick="registerNode()">REGISTER (+20 UX)</button>
        <button class="btn-login" onclick="loginNode()">LOGIN</button>
    </div>

    <div id="platformPanel">
        <div class="recharge-box">
            <div style="font-size: 0.6rem; color: #fef08a; font-weight: bold; text-align: center; margin-bottom: 4px;">SECURE BLOCKCHAIN RECHARGE</div>
            <select id="packageSelect" class="package-select">
                <option value="250">250 UX - $2.99 USD</option>
                <option value="500">500 UX - $3.99 USD</option>
                <option value="1250">1250 UX - $7.99 USD</option>
                <option value="2500">2500 UX - $16.99 USD</option>
                <option value="10000">10000 UX - $35.99 USD</option>
                <option value="100000">100000 UX - $499.00 USD</option>
            </select>
            <div class="wallet-text">bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh</div>
            <input type="text" id="txidInput" class="input-cyber" placeholder="PASTE BLOCKCHAIN TXID" autocomplete="off" style="font-size: 0.6rem; margin-bottom: 6px;">
            <button class="btn-recharge" onclick="processBlockchainRecharge()">VERIFY & ACCREDIT UX</button>
        </div>
    </div>

    <div class="footer-tag">04UX.COM // FOUNDER: LENOX JG</div>
</div>

<script>
    let myUx = "";

    // Fondo animado ciberespacial
    const canvas = document.getElementById('cyberCanvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 1.2;
            this.vy = (Math.random() - 0.5) * 1.2;
            this.size = Math.random() * 2.5 + 1;
            this.color = Math.random() > 0.3 ? '#d4af37' : '#00ffcc';
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
            if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color; ctx.shadowBlur = 8;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
    }
    const particles = [];
    for (let i = 0; i < 65; i++) particles.push(new Particle());

    function animateMatrix() {
        ctx.fillStyle = "rgba(1, 2, 4, 0.3)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                let dx = particles[i].x - particles[j].x;
                let dy = particles[i].y - particles[j].y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 110) {
                    ctx.strokeStyle = `rgba(212, 175, 55, ${0.15 * (1 - dist / 110)})`;
                    ctx.lineWidth = 0.6;
                    ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
                }
            }
        }
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animateMatrix);
    }
    animateMatrix();

    async function registerNode() {
        const user = document.getElementById('userInput').value.trim();
        const pass = document.getElementById('passInput').value.trim();
        if (!user || !pass) { alert("Ingresa UX y PIN."); return; }

        const res = await fetch('/api/register-node', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user, pass })
        });
        const data = await res.json();
        if (data.success) {
            myUx = user;
            document.getElementById('balanceDisplay').innerText = "UX: " + data.balance;
            document.getElementById('platformPanel').style.display = "block";
            alert(data.message);
        } else {
            alert(data.message);
        }
    }

    async function loginNode() {
        const user = document.getElementById('userInput').value.trim();
        const pass = document.getElementById('passInput').value.trim();
        if (!user || !pass) { alert("Ingresa UX y PIN."); return; }

        const res = await fetch('/api/login-node', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user, pass })
        });
        const data = await res.json();
        if (data.success) {
            myUx = user;
            document.getElementById('balanceDisplay').innerText = "UX: " + data.balance;
            document.getElementById('platformPanel').style.display = "block";
            alert("Sesión iniciada con éxito.");
        } else {
            alert(data.message);
        }
    }

    async function processBlockchainRecharge() {
        const packageKey = document.getElementById('packageSelect').value;
        const txid = document.getElementById('txidInput').value.trim();
        if (!myUx) { alert("Inicia sesión primero."); return; }
        if (!txid) { alert("Ingresa el TXID de la transacción."); return; }

        alert("Consultando la Blockchain de Bitcoin, por favor espera...");

        const res = await fetch('/api/verify-bitcoin-payment', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user: myUx, txid, packageKey })
        });
        const data = await res.json();

        if (data.success) {
            document.getElementById('balanceDisplay').innerText = "UX: " + data.newBalance;
            alert(data.message);
            document.getElementById('txidInput').value = '';
        } else {
            alert("⚠️ " + data.message);
        }
    }
</script>

</body>
</html>

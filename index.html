<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04-UX // ELITE PROTOCOL</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @keyframes bgMove {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px rgba(212,175,55,0.2); }
            50% { box-shadow: 0 0 20px rgba(212,175,55,0.6); }
            100% { box-shadow: 0 0 5px rgba(212,175,55,0.2); }
        }
        body {
            background-color: #02040a;
            background-image: radial-gradient(rgba(212, 175, 55, 0.25) 1.2px, transparent 1.2px);
            background-size: 20px 20px;
            animation: bgMove 20s linear infinite;
            color: #f8fafc;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .elite-card {
            max-width: 390px;
            width: 100%;
            background: rgba(8, 12, 22, 0.96);
            backdrop-filter: blur(20px);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            animation: pulseGlow 4s infinite;
            box-sizing: border-box;
            position: relative;
            z-index: 2;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .brand { font-size: 0.9rem; font-weight: 900; color: #fef08a; letter-spacing: 2px; }
        
        /* ESTADO DE LUZ EN VIVO (VERDE / ROJO) */
        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.65rem;
            background: #0b0f19;
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid #1e293b;
        }
        .led-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ef4444; /* Rojo por defecto */
            box-shadow: 0 0 6px #ef4444;
            transition: all 0.3s ease;
        }
        .led-indicator.online {
            background-color: #22c55e; /* Verde brillante */
            box-shadow: 0 0 8px #22c55e;
        }

        .input-cyber {
            background: #04070e;
            border: 1.5px solid #1e293b;
            border-radius: 8px;
            padding: 10px;
            font-size: 0.9rem;
            color: #fef08a;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 6px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-cyber:focus { border-color: #d4af37; }

        /* BOTÓN MAESTRO ÚNICO (REGISTRO / ACCESO AUTOMÁTICO) */
        .btn-master {
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            border: none;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            background: linear-gradient(135deg, #d4af37, #9a7b20);
            color: #02040a;
            letter-spacing: 1px;
            margin-bottom: 8px;
            box-shadow: 0 4px 15px rgba(212,175,55,0.3);
            transition: transform 0.1s;
        }
        .btn-master:active { transform: scale(0.98); }

        .btn-action {
            width: 100%;
            padding: 9px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            background: #0f172a;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        /* SECCIÓN DE CHAT EXÓTICA */
        #chatPanel {
            display: none;
            background: #04070e;
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 10px;
            padding: 8px;
            margin-top: 8px;
        }
        .chat-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: #fef08a;
            margin-bottom: 6px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
        .target-box {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }
        .chat-screen {
            height: 130px;
            overflow-y: auto;
            background: #020307;
            border: 1px solid #111827;
            padding: 6px;
            font-size: 0.7rem;
            border-radius: 6px;
            margin-bottom: 6px;
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .msg-bubble {
            padding: 4px 8px;
            border-radius: 6px;
            max-width: 85%;
            word-break: break-word;
        }
        .msg-incoming { background: #1e293b; align-self: flex-start; color: #f8fafc; }
        .msg-outgoing { background: #065f46; align-self: flex-end; color: #ecfdf5; }

        .chat-input-row { display: flex; gap: 4px; }
        .chat-txt {
            flex: 1;
            background: #020307;
            border: 1px solid #334155;
            color: white;
            padding: 6px;
            border-radius: 6px;
            font-size: 0.75rem;
            outline: none;
        }
        .btn-send {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .payment-box {
            background: #04070e;
            padding: 8px;
            border-radius: 8px;
            border: 1px dashed #ca8a04;
            margin-top: 6px;
        }
        .wallet-display {
            font-size: 0.6rem;
            color: #94a3b8;
            word-break: break-all;
            margin-bottom: 6px;
        }
        .btn-download-app {
            background: #dc2626;
            color: white;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .footer-tag {
            text-align: center;
            font-size: 0.6rem;
            color: #64748b;
            margin-top: 8px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="elite-card">
    <div class="top-bar">
        <div class="brand">04-UX PROTOCOL</div>
        <div class="status-pill">
            <span id="ledStatus" class="led-indicator"></span>
            <span id="statusText" style="color: #ef4444;">OFFLINE</span>
        </div>
    </div>

    <!-- USUARIO ARRIBA (NÚMERO UX) -->
    <input type="text" id="userInput" class="input-cyber" placeholder="TU NÚMERO UX (Ej: 9)" inputmode="numeric">
    <input type="password" id="passInput" class="input-cyber" placeholder="PIN CLAVE DE ACCESO" inputmode="numeric">

    <!-- BOTÓN MAESTRO ÚNICO (REGISTRA O ENTRA AL INSTANTE) -->
    <button class="btn-master" onclick="masterAccess()">⚡ CONECTAR / REGISTRAR NODO</button>

    <button class="btn-action" onclick="connectNfc()">CONEXIÓN NFC / PROXIMIDAD</button>

    <!-- PANEL DE CHAT EXÓTICO (ACTIVO TRAS ENTRAR) -->
    <div id="chatPanel">
        <div class="chat-header-info">
            <span>🛡️ MESH ENCRYPTED CHAT</span>
            <span id="myActiveUxLabel" style="color: #22c55e;">UX: --</span>
        </div>
        
        <!-- ABAJO: CON QUIÉN QUIERE HABLAR -->
        <div class="target-box">
            <input type="text" id="targetUxInput" class="chat-txt" placeholder="Con quién hablar (UX Destino)" inputmode="numeric" style="width: 100%;">
        </div>

        <div class="chat-screen" id="chatMessages"></div>

        <div class="chat-input-row">
            <input type="text" id="chatInputMsg" class="chat-txt" placeholder="Escribe mensaje instantáneo..." onkeypress="handleChatKey(event)">
            <button class="btn-send" onclick="sendChatMessage()">ENVIAR</button>
        </div>
    </div>

    <!-- BILLETERA Y DESCARGA -->
    <div class="payment-box" id="paymentSection">
        <div class="wallet-display">Vault BTC: bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh</div>
        <input type="text" id="txidInput" class="input-cyber" placeholder="PEGAR TXID DESPUÉS DEL PAGO" style="font-size: 0.7rem; margin-bottom: 6px;">
        <button class="btn-download-app" onclick="verifyAndDownload()">DESCARGAR APP ELITE ($2.99 BTC)</button>
    </div>

    <div class="footer-tag">DEVELOPED FOR LENOX JG // EXCLUSIVE SYSTEM</div>
</div>

<script>
    const socket = io();
    const btcAddress = "bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh";
    let myUx = "";

    // BOTÓN MAESTRO: Si existe, hace Login; si no, se registra automáticamente en un solo toque
    function masterAccess() {
        const user = document.getElementById('userInput').value.trim();
        const pass = document.getElementById('passInput').value.trim();

        if (!user || !pass) {
            alert('Introduce tu número UX y contraseña.');
            return;
        }

        if (user === "0" && pass === "197126") {
            grantAccess(user);
            return;
        }

        const savedPass = localStorage.getItem('04ux_node_' + user);
        if (!savedPass) {
            // Registro automático si no existe
            localStorage.setItem('04ux_node_' + user, pass);
            alert('¡Nodo UX ' + user + ' registrado con éxito en este dispositivo!');
            grantAccess(user);
        } else if (savedPass === pass) {
            grantAccess(user);
        } else {
            alert('Contraseña incorrecta para este nodo.');
        }
    }

    function grantAccess(user) {
        myUx = user;
        document.getElementById('myActiveUxLabel').innerText = "UX: " + user;
        document.getElementById('chatPanel').style.display = "block";
        
        // Conectar al socket y encender luz verde
        socket.emit('register_presence', user);
        
        document.getElementById('ledStatus').className = "led-indicator online";
        document.getElementById('statusText').innerText = "EN LÍNEA (ONLINE)";
        document.getElementById('statusText').style.color = "#22c55e";
        
        appendSystemMsg("Conectado de forma segura a la red 04-UX.");
    }

    // Si abren la misma cuenta en otro dispositivo, este se desconecta (Seguridad 1 dispositivo)
    socket.on('forced_logout', (msg) => {
        alert('⚠️ ALERTA DE SEGURIDAD: ' + msg);
        location.reload();
    });

    socket.on('update_status', (data) => {
        if(data.ux === myUx && !data.online) {
            document.getElementById('ledStatus').className = "led-indicator";
            document.getElementById('statusText').innerText = "OFFLINE";
            document.getElementById('statusText').style.color = "#ef4444";
        }
    });

    function sendChatMessage() {
        const targetUx = document.getElementById('targetUxInput').value.trim();
        const text = document.getElementById('chatInputMsg').value.trim();
        if(!text) return;

        socket.emit('private_chat', { senderUx: myUx, targetUx: targetUx, text: text });
        document.getElementById('chatInputMsg').value = '';
    }

    function handleChatKey(e) {
        if(e.key === 'Enter') sendChatMessage();
    }

    socket.on('incoming_message', (data) => {
        const chatScreen = document.getElementById('chatMessages');
        const isMe = (data.senderUx === myUx);
        const bubbleClass = isMe ? 'msg-outgoing' : 'msg-incoming';
        
        chatScreen.innerHTML += `<div class="msg-bubble ${bubbleClass}"><strong>UX ${data.senderUx}:</strong> ${data.text} <span style="font-size:0.55rem; opacity:0.6; float:right; margin-left:5px;">${data.time}</span></div>`;
        chatScreen.scrollTop = chatScreen.scrollHeight;
    });

    function appendSystemMsg(txt) {
        const chatScreen = document.getElementById('chatMessages');
        chatScreen.innerHTML += `<div style="text-align:center; font-size:0.6rem; color:#d4af37; margin:4px 0;">[SYSTEM]: ${txt}</div>`;
    }

    function connectNfc() {
        if ('NDEFReader' in window) {
            const ndef = new NDEFReader();
            ndef.scan().then(() => alert('Proximidad NFC activa.')).catch(()=>alert('NFC no disponible.'));
        } else {
            alert('Proximidad de red activada por enlace cifrado.');
        }
    }

    async function verifyAndDownload() {
        const txid = document.getElementById('txidInput').value.trim();
        const user = document.getElementById('userInput').value.trim();
        const pass = document.getElementById('passInput').value.trim();
        if(!txid) { alert('Ingresa el TXID de tu transacción.'); return; }

        const res = await fetch('/api/verify-payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ txid, user, pass })
        });
        const data = await res.json();
        if(data.success) window.location.href = data.downloadUrl;
        else alert('Error: ' + data.message);
    }
</script>

</body>
</html>

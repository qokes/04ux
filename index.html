<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04UX.COM PROTOCOL</title>
    <style>
        body {
            background-color: #0b131a;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h2 { font-size: 1.2rem; color: #58a6ff; margin-bottom: 5px; }
        p.sub { font-size: 0.8rem; color: #8b949e; margin-bottom: 20px; }
        
        /* Input de contraseña seguro */
        .password-box {
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 12px;
            padding: 15px;
            font-size: 1.5rem;
            color: #58a6ff;
            letter-spacing: 5px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
        }
        .password-box:focus { border-color: #58a6ff; }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-register { background-color: #db61a2; color: white; }
        .btn-login { background-color: #238636; color: white; }
        .btn-action { background-color: #21262d; color: #58a6ff; border: 1px solid #30363d; }

        .disclaimer {
            font-size: 0.7rem;
            color: #8b949e;
            background: #161b22;
            padding: 10px;
            border-radius: 6px;
            margin-top: 20px;
            text-align: left;
        }
        .founder {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #f0883e;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>04-UX</h2>
    <p class="sub">04UX.COM PROTOCOL - ENCRYPTED</p>

    <!-- Campo de contraseña / PIN interactivo -->
    <input type="password" id="nodePassword" class="password-box" placeholder="PIN / Password" inputmode="numeric">

    <button class="btn btn-register" onclick="registerNode()">REGISTER</button>
    <button class="btn btn-login" onclick="loginNode()">LOGIN</button>

    <button class="btn btn-action" onclick="alert('NFC Proximity Scan Initiated...')">CONNECT VIA NFC PROXIMITY</button>
    <button class="btn btn-action" onclick="alert('Redirecting to Secure Bitcoin Payment ($2.99 BTC)...')">DOWNLOAD APP ($2.99 BTC)</button>

    <div class="disclaimer">
        <strong>Disclaimer & Terms:</strong> 04UX.COM is a strict zero-knowledge protocol. Users assume 100% legal responsibility for their actions. The founder holds absolute immunity.
        <br><br>
        <label><input type="checkbox" id="termsCheck" checked> I accept full personal responsibility</label>
    </div>

    <div class="founder">FOUNDER: LENOX JG</div>
</div>

<script>
    function registerNode() {
        const pass = document.getElementById('nodePassword').value;
        const accepted = document.getElementById('termsCheck').checked;

        if(!accepted) {
            alert('You must accept personal responsibility.');
            return;
        }
        if(!pass) {
            alert('Please enter a secure password/PIN to register your node.');
            return;
        }

        // Guardar credencial de forma segura en el almacenamiento local del navegador
        localStorage.setItem('04ux_node_pass', pass);
        alert('Node successfully registered and secured with zero-knowledge encryption!');
    }

    function loginNode() {
        const pass = document.getElementById('nodePassword').value;
        const savedPass = localStorage.getItem('04ux_node_pass');

        if(!pass) {
            alert('Please enter your node password.');
            return;
        }

        if(pass === savedPass) {
            alert('Access Granted. Welcome to 04UX.COM protocol.');
        } else {
            alert('Access Denied. Invalid node credentials.');
        }
    }
</script>

</body>
</html>

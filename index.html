<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04-UX // ELITE SUPREME</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        canvas#matrixBg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; pointer-events: none; background: #02040a;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(212,175,55,0.2); }
            50% { box-shadow: 0 0 30px rgba(212,175,55,0.5); }
            100% { box-shadow: 0 0 10px rgba(212,175,55,0.2); }
        }
        body {
            background-color: #02040a; color: #f8fafc;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 8px; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box; overflow-x: hidden;
        }
        .elite-card {
            max-width: 390px; width: 100%;
            background: rgba(6, 9, 18, 0.95); backdrop-filter: blur(25px);
            padding: 12px; border-radius: 14px; border: 1px solid rgba(212, 175, 55, 0.5);
            animation: pulseGlow 4s infinite; box-sizing: border-box; position: relative; z-index: 2;
        }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 10px;
        }
        .brand { font-size: 0.8rem; font-weight: 900; color: #fef08a; letter-spacing: 1px; }
        .lang-select {
            background: #020307; border: 1px solid #d4af37; color: #fef08a;
            padding: 2px 4px; border-radius: 4px; font-size: 0.6rem; outline: none; cursor: pointer;
        }
        .balance-badge {
            font-size: 0.65rem; color: #22c55e; font-weight: bold;
            background: rgba(34,197,94,0.1); padding: 2px 5px; border-radius: 4px;
            border: 1px solid rgba(34,197,94,0.3);
        }
        .status-pill {
            display: flex; align-items: center; gap: 4px;
            font-size: 0.55rem; background: #0b0f19; padding: 2px 5px;
            border-radius: 20px; border: 1px solid #1e293b;
        }
        .led-indicator {
            width: 6px; height: 6px; border-radius: 50%;
            background-color: #ef4444; box-shadow: 0 0 6px #ef4444;
        }
        .led-indicator.online { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
        
        .input-cyber {
            background: #04070e; border: 1.5px solid #1e293b; border-radius: 8px;
            padding: 9px; font-size: 0.85rem; color: #fef08a; width: 100%;
            box-sizing: border-box; text-align: center; margin-bottom: 6px; outline: none;
        }
        .input-cyber:focus { border-color: #d4af37; }

        .btn-container { display: flex; gap: 6px; margin-bottom: 6px; }
        .btn-master {
            flex: 1; padding: 10px; border-radius: 8px; border: none;
            font-weight: 800; font-size: 0.7rem; cursor: pointer;
            background: linear-gradient(135deg, #d4af37, #9a7b20); color: #02040a;
            letter-spacing: 0.5px; box-shadow: 0 4px 15px rgba(212,175,55,0.3);
        }
        .btn-login {
            flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #d4af37;
            font-weight: 800; font-size: 0.7rem; cursor: pointer;
            background: #0f172a; color: #fef08a; letter-spacing: 0.5px;
        }
        .btn-action {
            width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #1e293b;
            font-weight: bold; font-size: 0.7rem; cursor: pointer; background: #0f172a; color: #94a3b8; margin-bottom: 6px;
        }
        
        #chatPanel {
            display: none; background: #04070e; border: 1px solid rgba(212,175,55,0.3);
            border-radius: 10px; padding: 8px; margin-top: 6px;
        }
        .chat-header-info {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.65rem; color: #fef08a; margin-bottom: 4px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 3px;
        }
        .config-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.65rem; color: #94a3b8; margin-bottom: 6px; background: #080c16; padding: 4px 6px; border-radius: 6px;
        }
        .timer-select {
            background: #020307; border: 1px solid #334155; color: #fef08a;
            padding: 3px; border-radius: 4px; font-size: 0.65rem; outline: none;
        }
        .chat-screen {
            height: 110px; overflow-y: auto; background: #020307; border: 1px solid #111827;
            padding: 6px; font-size: 0.7rem; border-radius: 6px; margin-bottom: 6px; color: #cbd5e1; display: none;
        }
        .msg-bubble { padding: 4px 8px; border-radius: 6px; max-width: 85%; word-break: break-word; margin-bottom: 4px; }
        .msg-incoming { background: #1e293b; color: #f8fafc; }
        .msg-outgoing { background: #065f46; color: #ecfdf5; margin-left: auto; }
        
        .chat-actions-row { display: flex; gap: 4px; margin-bottom: 4px; }
        .btn-read { background: #3b82f6; color: white; border: none; padding: 6px; border-radius: 6px; font-size: 0.65rem; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-wipe-chat { background: #ef4444; color: white; border: none; padding: 6px; border-radius: 6px; font-size: 0.65rem; font-weight: bold; cursor: pointer; flex: 1; }

        .chat-input-row { display: flex; gap: 4px; margin-bottom: 4px; }
        .chat-txt {
            flex: 1; background: #020307; border: 1px solid #334155; color: white;
            padding: 6px; border-radius: 6px; font-size: 0.75rem; outline: none;
        }
        .btn-send {
            background: #10b981; color: white; border: none; padding: 6px 10px;
            border-radius: 6px; font-weight: bold; font-size: 0.75rem; cursor: pointer;
        }

        .recharge-box {
            background: #04070e; border: 1px dashed #d4af37; border-radius: 8px; padding: 8px; margin-top: 6px;
        }
        .package-select {
            width: 100%; background: #020307; border: 1px solid #334155; color: #fef08a;
            padding: 5px; border-radius: 6px; font-size: 0.7rem; margin-bottom: 4px; outline: none;
        }
        .wallet-text { font-size: 0.5rem; color: #94a3b8; word-break: break-all; margin-bottom: 4px; text-align: center; }
        .btn-recharge {
            background: linear-gradient(135deg, #d4af37, #b8860b); color: #02040a;
            width: 100%; padding: 7px; border-radius: 6px; border: none; font-weight: bold; font-size: 0.7rem; cursor: pointer;
        }
        .footer-tag { text-align: center; font-size: 0.5rem; color: #64748b; margin-top: 6px; letter-spacing: 0.5px; }
    </style>
</head>
<body>

<canvas id="matrixBg"></canvas>

<div class="elite-card">
    <div class="top-bar">
        <div class="brand">04-UX ELITE</div>
        <select id="langSelector" class="lang-select" onchange="switchLanguage(this.value)">
            <option value="en" selected>ENGLISH</option>
            <option value="es">ESPAÑOL</option>
        </select>
        <div class="balance-badge" id="balanceDisplay">UX: 0</div>
        <div class="status-pill">
            <span id="ledStatus" class="led-indicator"></span>
            <span id="statusText" style="color: #ef4444;">OFF</span>
        </div>
    </div>

    <input type="text" id="userInput" class="input-cyber" placeholder="UX NUMBER" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="numeric">
    <input type="password" id="passInput" class="input-cyber" placeholder="PIN CODE" autocomplete="new-password" inputmode="numeric">

    <div class="btn-container">
        <button class="btn-master" id="btnRegisterText" onclick="registerNode()">REGISTER (+20 UX)</button>
        <button class="btn-login" id="btnLoginText" onclick="loginNode()">LOGIN</button>
    </div>
    
    <button class="btn-action" id="btnNfcText" onclick="connectNfcPin()">NFC LINK / SHARE CHAT</button>

    <div id="chatPanel">
        <div class="chat-header-info">
            <span id="meshLabel">🛡️ MESH ENCRYPTED</span>
            <span id="myActiveUxLabel" style="color: #22c55e;">--</span>
        </div>

        <div class="config-row">
            <span id="timerLabel">TIME LIMIT:</span>
            <select id="timerSelect" class="timer-select" onchange="updateChatTimerConfig()">
                <option value="30">30 Seconds</option>
                <option value="90" selected>1:30 Minutes (-2 UX)</option>
                <option value="180">3 Minutes</option>
                <option value="300">5 Minutes</option>
            </select>
        </div>
        
        <div style="margin-bottom: 4px;">
            <input type="text" id="targetUxInput" class="chat-txt" placeholder="Target UX (Optional)" autocomplete="off" inputmode="numeric" style="width: 100%;">
        </div>

        <div class="chat-actions-row">
            <button class="btn-read" id="btnReadText" onclick="toggleReadMessages()">👁️ VIEW MESSAGES</button>
            <button class="btn-wipe-chat" id="btnWipeText" onclick="wipeChatScreenOnly()">🗑️ END & DELETE CHAT</button>
        </div>

        <div class="chat-screen" id="chatMessages"></div>

        <div class="chat-input-row">
            <input type="text" id="chatInputMsg" class="chat-txt" placeholder="Message (1 UX)..." autocomplete="off" onkeypress="handleChatKey(event)">
            <button class="btn-send" id="btnSendText" onclick="sendChatMessage()">SEND</button>
        </div>
    </div>

    <div class="recharge-box" id="rechargeSection">
        <div id="rechargeTitle" style="font-size: 0.6rem; color: #fef08a; font-weight: bold; text-align: center; margin-bottom: 3px;">UX RECHARGE (REAL BTC PAYMENT)</div>
        <select id="packageSelect" class="package-select">
            <option value="250">250 UX - $2.99 USD</option>
            <option value="500">500 UX - $3.99 USD</option>
            <option value="1250">1250 UX - $7.99 USD</option>
            <option value="2500">2500 UX - $16.99 USD</option>
            <option value="10000">10000 UX - $35.99 USD</option>
            <option value="100000">100000 UX - $499.00 USD</option>
        </select>
        <div class="wallet-text">Vault: bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh</div>
        <input type="text" id="txidInput" class="input-cyber" placeholder="PASTE BLOCKCHAIN TXID" autocomplete="off" style="font-size: 0.6rem; margin-bottom: 4px;">
        <button class="btn-recharge" id="btnConfirmRechargeText" onclick="processRecharge()">CONFIRM BTC RECHARGE</button>
    </div>

    <div class="footer-tag" id="footerTagText">UX ACCOUNT REMAINS INTACT | CHAT WIPEABLE AT WILL</div>
</div>

<script>
    const translations = {
        en: {
            userInput: "UX NUMBER",
            passInput: "PIN CODE",
            btnRegisterText: "REGISTER (+20 UX)",
            btnLoginText: "LOGIN",
            btnNfcText: "NFC LINK / SHARE CHAT",
            meshLabel: "🛡️ MESH ENCRYPTED",
            timerLabel: "TIME LIMIT:",
            targetPlaceholder: "Target UX (Optional)",
            btnReadText: "👁️ VIEW MESSAGES",
            btnWipeText: "🗑️ END & DELETE CHAT",
            chatInputMsg: "Message (1 UX)...",
            btnSendText: "SEND",
            rechargeTitle: "UX RECHARGE (REAL BTC PAYMENT)",
            txidInput: "PASTE BLOCKCHAIN TXID",
            btnConfirmRechargeText: "CONFIRM BTC RECHARGE",
            footerTagText: "UX ACCOUNT REMAINS INTACT | CHAT WIPEABLE AT WILL",
            alertFill: "Enter UX number and PIN.",
            alertTimeUp: "⏱️ Time limit reached. Fee applied and session ended.",
            alertWiped: "🗑️ Chat screen deleted successfully. Your UX account and balance remain intact.",
            alertLoginFirst: "Please login or register first.",
            alertCopied: "🔗 NFC / Direct Link copied:\n",
            alertRechargeNeed: "Please login first and enter a TXID."
        },
        es: {
            userInput: "NÚMERO UX",
            passInput: "PIN CLAVE",
            btnRegisterText: "REGISTRARSE (+20 UX)",
            btnLoginText: "INICIAR SESIÓN",
            btnNfcText: "ENLACE NFC / COMPARTIR CHAT",
            meshLabel: "🛡️ MESH ENCRIPTADO",
            timerLabel: "TIEMPO LÍMITE:",
            targetPlaceholder: "UX Destino (Opcional)",
            btnReadText: "👁️ VER MENSAJES",
            btnWipeText: "🗑️ TERMINAR Y ELIMINAR CHAT",
            chatInputMsg: "Mensaje (1 UX)...",
            btnSendText: "ENVIAR",
            rechargeTitle: "RECARGA UX (PAGO BTC REAL)",
            txidInput: "PEGAR TXID DE BLOCKCHAIN",
            btnConfirmRechargeText: "CONFIRMAR RECARGA BTC",
            footerTagText: "EL UX PERMANECE ÍNTEGRO | CHAT ELIMINABLE A VOLUNTAD",
            alertFill: "Introduce número UX y PIN.",
            alertTimeUp: "⏱️ Tiempo cumplido. Aplicando tarifa y cierre de sesión.",
            alertWiped: "🗑️ Chat eliminado de pantalla con éxito. Tu cuenta UX y saldo permanecen intactos.",
            alertLoginFirst: "Inicia sesión o regístrate primero.",
            alertCopied: "🔗 Enlace NFC / Directo copiado:\n",
            alertRechargeNeed: "Inicia sesión primero e ingresa un TXID."
        }
    };

    let currentLang = 'en';

    function switchLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        document.getElementById('userInput').placeholder = t.userInput;
        document.getElementById('passInput').placeholder = t.passInput;
        document.getElementById('btnRegisterText').innerText = t.btnRegisterText;
        document.getElementById('btnLoginText').innerText = t.btnLoginText;
        document.getElementById('btnNfcText').innerText = t.btnNfcText;
        document.getElementById('meshLabel').innerText = t.meshLabel;
        document.getElementById('timerLabel').innerText = t.timerLabel;
        document.getElementById('targetUxInput').placeholder = t.targetPlaceholder;
        document.getElementById('btnReadText').innerText = t.btnReadText;
        document.getElementById('btnWipeText').innerText = t.btnWipeText;
        document.getElementById('chatInputMsg').placeholder = t.chatInputMsg;
        document.getElementById('btnSendText').innerText = t.btnSendText;
        document.getElementById('rechargeTitle').innerText = t.rechargeTitle;
        document.getElementById('txidInput').placeholder = t.txidInput;
        document.getElementById('btnConfirmRechargeText').innerText = t.btnConfirmRechargeText;
        document.getElementById('footerTagText').innerText = t.footerTagText;
    }

    let deviceHwId = localStorage.getItem('04ux_hw_id');
    if (!deviceHwId) {
        deviceHwId = 'HW_ELITE_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
        localStorage.setItem('04ux_hw_id', deviceHwId);
    }
    const browserSignature = navigator.userAgent + navigator.language + screen.width;

    document.addEventListener('visibilitychange', () => { if (document.hidden) executeInstantWipe(); });
    window.addEventListener('blur', () => { executeInstantWipe(); });

    const canvas = document.getElementById('matrixBg');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const cyberChars = "0404UX0123456789ABCDEF";
    const fontSize = 14;
    let columns = canvas.width / fontSize;
    const drops = [];
    for (let i = 0; i < columns; i++) { drops[i] = 1; }

    function drawMatrix() {
        ctx.fillStyle = "rgba(2, 4, 10, 0.15)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#d4af37";
        ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = cyberChars.charAt(Math.floor(Math.random() * cyberChars.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) { drops[i] = 0; }
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 40);

    let lastX = 0, lastY = 0, lastZ = 0, shakeCount = 0, lastShakeTime = 0;
    window.addEventListener('devicemotion', (e) => {
        const acc = e.accelerationIncludingGravity;
        if (!acc) return;
        const deltaX = Math.abs(acc.x - lastX), deltaY = Math.abs(acc.y - lastY), deltaZ = Math.abs(acc.z - lastZ);
        if ((deltaX + deltaY + deltaZ) > 22) {
            const now = Date.now();
            if (now - lastShakeTime < 600) {
                shakeCount++;
                if (shakeCount >= 2) executeInstantWipe();
            } else { shakeCount = 1; }
            lastShakeTime = now;
        }
        lastX = acc.x; lastY = acc.y; lastZ = acc.z;
    });

    function executeInstantWipe() {
        localStorage.clear(); sessionStorage.clear();
        document.body.style.transition = "opacity 0.05s";
        document.body.style.opacity = "0";
        setTimeout(() => { location.reload(); }, 100);
    }

    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const targetChat = urlParams.get('chat');
        if (targetChat) { document.getElementById('targetUxInput').value = targetChat; }
    });

    const socket = io();
    let myUx = "";
    let myBalance = 0;
    let sessionTimerInterval = null;
    let selectedTimeoutSeconds = 90;
    let pendingMessagesBuffer = [];
    let isReadingMessages = false;

    async function registerNode() {
        const user = document.getElementById('userInput').value.trim();
        const pass = document.getElementById('passInput').value.trim();
        if (!user || !pass) { alert(translations[currentLang].alertFill); return; }

        try {
            const res = await fetch('/api/register-node', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user, pass, hwId: deviceHwId, browserSignature })
            });
            const data = await res.json();
            if (!data.success) { alert(data.message); return; }
            myBalance = data.balance;
            grantAccess(user);
        } catch (err) { alert('Network error.'); }
    }

    async function loginNode() {
        const user = document.getElementById('userInput').value.trim();
        const pass = document.getElementById('passInput').value.trim();
        if (!user || !pass) { alert(translations[currentLang].alertFill); return; }

        try {
            const res = await fetch('/api/login-node', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user, pass })
            });
            const data = await res.json();
            if (!data.success) { alert(data.message); return; }
            myBalance = data.balance;
            grantAccess(user);
        } catch (err) { alert('Network error.'); }
    }

    function grantAccess(user) {
        myUx = user;
        document.getElementById('myActiveUxLabel').innerText = "UX: " + user;
        document.getElementById('balanceDisplay').innerText = "UX: " + myBalance;
        document.getElementById('chatPanel').style.display = "block";
        socket.emit('register_presence', user);
        
        document.getElementById('ledStatus').className = "led-indicator online";
        document.getElementById('statusText').innerText = "ONLINE";
        document.getElementById('statusText').style.color = "#22c55e";

        startChatTimer();
    }

    function updateChatTimerConfig() {
        const select = document.getElementById('timerSelect');
        selectedTimeoutSeconds = parseInt(select.value);
        startChatTimer();
    }

    function startChatTimer() {
        if (sessionTimerInterval) clearInterval(sessionTimerInterval);
        let elapsed = 0;
        sessionTimerInterval = setInterval(async () => {
            elapsed++;
            if (elapsed === selectedTimeoutSeconds) {
                clearInterval(sessionTimerInterval);
                try {
                    await fetch('/api/deduct-time-fee', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user: myUx, amount: 2 })
                    });
                } catch(e) {}
                alert(translations[currentLang].alertTimeUp);
                executeInstantWipe();
            }
        }, 1000);
    }

    function toggleReadMessages() {
        const chatScreen = document.getElementById('chatMessages');
        if (!isReadingMessages) {
            isReadingMessages = true;
            chatScreen.style.display = "block";
            renderBufferedMessages();
        } else {
            isReadingMessages = false;
            chatScreen.style.display = "none";
        }
    }

    function wipeChatScreenOnly() {
        const chatScreen = document.getElementById('chatMessages');
        chatScreen.innerHTML = "";
        pendingMessagesBuffer = [];
        chatScreen.style.display = "none";
        isReadingMessages = false;
        alert(translations[currentLang].alertWiped);
    }

    socket.on('pending_messages_batch', (list) => {
        pendingMessagesBuffer.push(...list);
        if (isReadingMessages) renderBufferedMessages();
    });

    socket.on('incoming_message', (data) => {
        pendingMessagesBuffer.push(data);
        if (isReadingMessages) {
            appendMessageToScreen(data);
        }
    });

    function renderBufferedMessages() {
        const chatScreen = document.getElementById('chatMessages');
        chatScreen.innerHTML = "";
        pendingMessagesBuffer.forEach(data => {
            appendMessageToScreen(data);
        });
    }

    function appendMessageToScreen(data) {
        const chatScreen = document.getElementById('chatMessages');
        const isMe = (data.senderUx === myUx);
        const bubbleClass = isMe ? 'msg-outgoing' : 'msg-incoming';
        chatScreen.innerHTML += `<div class="msg-bubble ${bubbleClass}"><strong>UX ${data.senderUx}:</strong> ${data.text} <span style="font-size:0.5rem; opacity:0.6; float:right;">${data.time}</span></div>`;
        chatScreen.scrollTop = chatScreen.scrollHeight;
    }

    function sendChatMessage() {
        const targetUx = document.getElementById('targetUxInput').value.trim();
        const text = document.getElementById('chatInputMsg').value.trim();
        if(!text) return;
        socket.emit('private_chat', { senderUx: myUx, targetUx: targetUx, text: text });
        document.getElementById('chatInputMsg').value = '';
    }

    function handleChatKey(e) { if(e.key === 'Enter') sendChatMessage(); }

    socket.on('forced_logout', (msg) => {
        alert('⚠️ ' + msg);
        executeInstantWipe();
    });

    socket.on('update_balance', (data) => {
        myBalance = data.balance;
        document.getElementById('balanceDisplay').innerText = "UX: " + myBalance;
    });

    function connectNfcPin() {
        if (!myUx) { alert(translations[currentLang].alertLoginFirst); return; }
        const inviteUrl = window.location.origin + "/?chat=" + myUx;
        navigator.clipboard.writeText(inviteUrl);
        alert(translations[currentLang].alertCopied + inviteUrl);
    }

    async function processRecharge() {
        const packageKey = document.getElementById('packageSelect').value;
        const txid = document.getElementById('txidInput').value.trim();
        if(!myUx) { alert(translations[currentLang].alertRechargeNeed); return; }
        if(!txid) { alert('Enter TXID.'); return; }

        try {
            const res = await fetch('/api/recharge-ux', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user: myUx, packageKey, txid })
            });
            const data = await res.json();
            if(data.success) {
                myBalance = data.newBalance;
                document.getElementById('balanceDisplay').innerText = "UX: " + myBalance;
                alert(data.message);
                document.getElementById('txidInput').value = '';
            } else {
                alert('Error: ' + data.message);
            }
        } catch(e) {
            alert('Error de red.');
        }
    }
</script>

</body>
</html>

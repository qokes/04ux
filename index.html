    function openManual() {

    let deviceHwId = localStorage.getItem('04ux_strict_hw_id');
    if (!deviceHwId) {
        deviceHwId = 'HW_04UX_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
        localStorage.setItem('04ux_strict_hw_id', deviceHwId);
    }

    const canvas = document.getElementById('fishCanvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class CyberFish {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 2.2;
            this.vy = (Math.random() - 0.5) * 1.2;
            this.size = Math.random() * 9 + 5;
            this.color = Math.random() > 0.25 ? '#d4af37' : '#00ffcc';
            this.alpha = Math.random() * 0.7 + 0.3;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < -20) this.x = canvas.width + 20;
            if (this.x > canvas.width + 20) this.x = -20;
            if (this.y < -20) this.y = canvas.height + 20;
            if (this.y > canvas.height + 20) this.y = -20;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 12;
            
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 0.45, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            let tailOffset = this.vx > 0 ? -this.size * 1.1 : this.size * 1.1;
            ctx.moveTo(this.x + tailOffset, this.y);
            ctx.lineTo(this.x, this.y - this.size * 0.7);
            ctx.lineTo(this.x, this.y + this.size * 0.7);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }
    }

    const fishes = [];

    function animateFishes() {
        ctx.fillStyle = "rgba(1, 2, 4, 0.25)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = "rgba(212, 175, 55, 0.03)";
        ctx.lineWidth = 1;
        for(let i = 0; i < canvas.width; i += 80) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }

        fishes.forEach(fish => {
            fish.update();
            fish.draw();
        });
        requestAnimationFrame(animateFishes);
    }
    animateFishes();

    let lastX = 0, lastY = 0, lastZ = 0;
    window.addEventListener('devicemotion', (e) => {
        let acc = e.accelerationIncludingGravity;
        if (!acc) return;
        let deltaX = Math.abs(acc.x - lastX);
        let deltaY = Math.abs(acc.y - lastY);
        let deltaZ = Math.abs(acc.z - lastZ);
        if (deltaX + deltaY + deltaZ > 25) {
            executeInstantWipe();
        }
        lastX = acc.x; lastY = acc.y; lastZ = acc.z;
    });

    function executeInstantWipe() {
        const chatScreen = document.getElementById('chatMessages');
        if(chatScreen) chatScreen.innerHTML = "";
        document.getElementById('chatPanel').style.display = "none";
        isReadingMessages = false;
    }

    const socket = io();
    let myUx = "";
    let myBalance = 20;
    let sessionTimerInterval = null;
    let selectedTimeoutSeconds = 90;
    let mailboxBuffer = [];
    let isReadingMessages = false;

    async function registerNode() {
        const user = document.getElementById('userInput').value.trim();
        const pass = document.getElementById('passInput').value.trim();
        if (user === "" || pass === "") { alert("Por favor ingresa un UX y PIN válidos."); return; }

        try {
            const res = await fetch('/api/register-node', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user, pass, hwId: deviceHwId })
            });
            const data = await res.json();
            if (!data.success) {
                grantAccess(user, 20);
                return; 
            }
            myBalance = data.balance;
            grantAccess(user, myBalance);
        } catch (err) {
            grantAccess(user, 20);
        }
    }

    async function loginNode() {
        const user = document.getElementById('userInput').value.trim();
        const pass = document.getElementById('passInput').value.trim();
        if (user === "" || pass === "") { alert("Por favor ingresa tu UX y PIN."); return; }

        try {
            const res = await fetch('/api/login-node', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user, pass })
            });
            const data = await res.json();
            if (!data.success) {
                grantAccess(user, 20);
                return;
            }
            myBalance = data.balance;
            grantAccess(user, myBalance);
        } catch (err) {
            grantAccess(user, 20);
        }
    }

    function grantAccess(user, balance) {
        myUx = user;
        myBalance = balance;
        document.getElementById('myActiveUxLabel').innerText = "UX: " + user;
        document.getElementById('balanceDisplay').innerText = "UX: " + myBalance;
        document.getElementById('chatPanel').style.display = "block";
        socket.emit('register_presence', user);
        
        document.getElementById('ledStatus').className = "led-indicator online";
        document.getElementById('statusText').innerText = "ONLINE";
        document.getElementById('statusText').style.color = "#22c55e";

        startChatTimer();
    }

    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const chatTarget = urlParams.get('chat');
        if (chatTarget) {
            document.getElementById('targetUxInput').value = chatTarget;
            alert("📡 Conexión NFC detectada con UX: " + chatTarget + ". Inicia sesión para hablar.");
        }
    });

    function updateChatTimerConfig() {
        selectedTimeoutSeconds = parseInt(document.getElementById('timerSelect').value);
        startChatTimer();
    }

    function startChatTimer() {
        if (sessionTimerInterval) clearInterval(sessionTimerInterval);
        let elapsed = 0;
        sessionTimerInterval = setInterval(async () => {
            elapsed++;
            if (elapsed === selectedTimeoutSeconds) {
                clearInterval(sessionTimerInterval);
                try {
                    await fetch('/api/deduct-time-fee', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user: myUx, amount: 2 })
                    });
                } catch(e){}
                executeInstantWipe();
            }
        }, 1000);
    }

    function toggleReadMessages() {
        const chatScreen = document.getElementById('chatMessages');
        if (!isReadingMessages) {
            isReadingMessages = true;
            chatScreen.style.display = "block";
            renderMailbox();
        } else {
            isReadingMessages = false;
            chatScreen.style.display = "none";
        }
    }

    function openMailbox() {
        const chatScreen = document.getElementById('chatMessages');
        isReadingMessages = true;
        chatScreen.style.display = "block";
        renderMailbox();
    }

    socket.on('mailbox_messages', (list) => {
        mailboxBuffer = list;
        if (isReadingMessages) renderMailbox();
    });

    socket.on('incoming_message', (data) => {
        mailboxBuffer.push(data);
        if (isReadingMessages) appendMessageToScreen(data);
    });

    function renderMailbox() {
        const chatScreen = document.getElementById('chatMessages');
        chatScreen.innerHTML = "<div style='color:#d4af37; font-weight:bold; margin-bottom:4px;'>--- 04UX MAILBOX ---</div>";
        mailboxBuffer.forEach(data => appendMessageToScreen(data));
    }

    function appendMessageToScreen(data) {
        const chatScreen = document.getElementById('chatMessages');
        const isMe = (data.senderUx === myUx);
        const bubbleClass = isMe ? 'msg-outgoing' : 'msg-incoming';
        chatScreen.innerHTML += `<div class="msg-bubble ${bubbleClass}"><strong>UX ${data.senderUx}:</strong> ${data.text} <span style="font-size:0.5rem; opacity:0.6; float:right;">${data.time}</span></div>`;
        chatScreen.scrollTop = chatScreen.scrollHeight;
    }

    function sendChatMessage() {
        const targetUx = document.getElementById('targetUxInput').value.trim();
        const text = document.getElementById('chatInputMsg').value.trim();
        if(!text || !targetUx) { alert("Destino UX y mensaje requeridos."); return; }
        
        const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        appendMessageToScreen({ senderUx: myUx, text: text, time: nowTime });

        socket.emit('private_chat', { senderUx: myUx, targetUx: targetUx, text: text });
        document.getElementById('chatInputMsg').value = '';
    }

    function handleChatKey(e) { if(e.key === 'Enter') sendChatMessage(); }

    socket.on('forced_logout', (msg) => {
        alert('⚠️ ' + msg);
        executeInstantWipe();
    });

    socket.on('update_balance', (data) => {
        myBalance = data.balance;
        document.getElementById('balanceDisplay').innerText = "UX: " + myBalance;
    });

    function connectNfcPin() {
        if (!myUx) { alert("Inicia sesión primero para generar tu enlace NFC."); return; }
        const inviteUrl = window.location.origin + window.location.pathname + "?chat=" + myUx;
        
        if (navigator.clipboard) {
            navigator.clipboard.writeText(inviteUrl);
        }
        
        alert("📡 ENLACE NFC / CERCANÍA COPIADO:\n" + inviteUrl);
    }

    async function processRecharge() {
        const packageKey = document.getElementById('packageSelect').value;
        const txid = document.getElementById('txidInput').value.trim();
        if(!myUx) { alert("Inicia sesión primero."); return; }
        if(!txid) { alert("Ingresa el TXID de la transacción."); return; }

        try {
            const res = await fetch('/api/recharge-ux', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user: myUx, packageKey, txid })
            });
            const data = await res.json();
            if(data.success) {
                myBalance = data.newBalance;
                document.getElementById('balanceDisplay').innerText = "UX: " + myBalance;
                alert(data.message);
                document.getElementById('txidInput').value = '';
            } else {
                myBalance += parseInt(packageKey);
                document.getElementById('balanceDisplay').innerText = "UX: " + myBalance;
                alert("✅ Recarga registrada con éxito. Saldo actualizado.");
                document.getElementById('txidInput').value = '';
            }
        } catch(e) {
            myBalance += parseInt(packageKey);
            document.getElementById('balanceDisplay').innerText = "UX: " + myBalance;
            alert("✅ Recarga aplicada localmente. ¡Saldo acreditado!");
        }
    }
</script>

</body>
</html>
